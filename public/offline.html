<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d473c" />
    <title>KABALIKAT is offline</title>
    <style>
      * { box-sizing: border-box; }
      body { align-items: center; background: #f7f5ef; color: #24353b; display: flex; font: 16px/1.6 system-ui, sans-serif; justify-content: center; margin: 0; min-height: 100vh; padding: 24px; }
      main { background: #fffefa; border: 1px solid #d9e2de; border-radius: 18px; max-width: 440px; padding: 30px; text-align: center; }
      img { height: 72px; width: 72px; }
      h1 { color: #164e4a; font-size: 23px; margin: 15px 0 8px; }
      p { margin: 0 0 18px; }
      button { background: #164e4a; border: 0; border-radius: 9px; color: white; cursor: pointer; font: inherit; font-weight: 700; min-height: 46px; padding: 9px 18px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/kabalikat-heart-v3-192.png" alt="" />
      <h1>You’re offline</h1>
      <p>KABALIKAT needs an internet connection to sign in and load secure barangay records. Reconnect, then try again.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
